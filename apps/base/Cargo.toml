[package]
name = "timezone-base"
version = "0.1.0"
edition = "2024"
publish = false

# Separate resolution prevents mixing incompatible GPUI types with the other app.
[workspace]

[dependencies]
base-gpui = { git = "https://github.com/LukeTandjung/base-gpui", rev = "a603edd0d1cb13d50fb900742ae9cfb78cb737e0" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d029c5ff5654fb1b1e8caf4462993c8ee13a133" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d029c5ff5654fb1b1e8caf4462993c8ee13a133" }
time-core = { path = "../../crates/time-core" }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d029c5ff5654fb1b1e8caf4462993c8ee13a133", features = ["test-support"] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
